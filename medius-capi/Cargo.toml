[package]
name = "medius-capi"
version = "3.4.6"
edition = "2024"
rust-version = "1.85"
description = "C ABI for the medius crate, the Rust library for Medius on the MAKCU box"
license = "MIT"
keywords = ["medius", "mouse", "hid", "ffi", "makcu"]
categories = ["hardware-support", "api-bindings", "external-ffi-bindings"]
repository = "https://github.com/K4HVH/medius"
homepage = "https://medius.k4tech.net/bindings/c"
readme = "README.md"

[package.metadata.docs.rs]
all-features = true

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[features]
default = []
mock = ["medius/mock"]

[dependencies]
# Pinned to the crate it ships with: a release publishes both at one version.
medius = { path = "..", version = "=3.4.6" }
