language = "C"
pragma_once = true
include_guard = "MEDIUS_H"
autogen_warning = "/* Generated by tools/gen-header.sh (cbindgen). Do not edit by hand. */"
header = """/* medius C ABI. https://medius.k4tech.net/bindings/c. MIT.
 *
 * Threads: a device, event-stream, input-stream, LOG-stream, clip or mock handle may be used from
 * several threads at once. A stream may be closed (medius_*_stream_close) while another thread is
 * blocked receiving on it, and that receive returns at once. Use a clip builder, clip frame or
 * timeline from one thread at a time. Free a handle only when no other thread is using it: close a
 * stream, let its receivers return, then free it.
 */"""
cpp_compat = true
documentation = true
documentation_style = "c99"
tab_width = 4
sys_includes = ["stdint.h", "stdbool.h", "stddef.h"]
no_includes = true

[defines]
"feature = mock" = "MEDIUS_FEATURE_MOCK"

[parse]
parse_deps = false

[export]
prefix = ""
# Callers pass these enums' constants as a validated uint8_t, so no ABI signature names them and
# cbindgen would prune them. Dropping one compiles clean in Rust and breaks every C caller, so each is
# pinned by name.
include = [
    "MediusAction",
    "MediusAxis",
    "MediusBearingMode",
    "MediusBlanket",
    "MediusButton",
    "MediusClass",
    "MediusClipAction",
    "MediusClipState",
    "MediusDeviceKind",
    "MediusDirection",
    "MediusEdge",
    "MediusEmitMode",
    "MediusLedMode",
    "MediusLedTarget",
    "MediusLockTargetKind",
    "MediusMotionKind",
    "MediusMoveTiming",
    "MediusPatchSection",
    "MediusPendingMotion",
    "MediusRebootTarget",
    "MediusRenderMode",
    "MediusRewriteAction",
    "MediusRewriteClass",
    "MediusTransferStatus",
    "MediusTransformOp",
]

[enum]
rename_variants = "QualifiedScreamingSnakeCase"
prefix_with_name = false

[fn]
sort_by = "None"

[const]
allow_static_const = true
allow_constexpr = false
